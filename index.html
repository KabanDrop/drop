<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>КабанDrop — симулятор кейсов CS2</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot">
  <img src="assets/logo.png" alt="">
  <div class="boot-bar"><i></i></div>
  <div class="boot-txt">загрузка предметов…</div>
</div>

<div class="app" id="app">
  <header class="header">
    <button class="logo" onclick="location.hash='#/cases'">
      <img src="assets/logo.png" alt="">
      <b>КАБАН<b style="color:var(--accent)">DROP</b></b>
    </button>

    <nav class="nav" id="nav">
      <button class="nav-link" data-tab="cases" onclick="location.hash='#/cases'">Кейсы</button>
      <button class="nav-link" data-tab="upgrade" onclick="location.hash='#/upgrade'">Апгрейд</button>
      <button class="nav-link" data-tab="inventory" onclick="location.hash='#/inventory'">Инвентарь</button>
      <button class="nav-link" data-tab="games" onclick="location.hash='#/games'">Мини игры</button>
    </nav>

    <div class="header-right">
      <div class="balances">
        <span class="bal-inv" title="Стоимость инвентаря">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16v13H4zM8 7V4h8v3M4 12h16"/></svg>
          <span id="balInvCount">0</span>
        </span>
        <span class="bal-coins" title="Баланс">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5a3 3 0 013-1.5c1.6 0 3 .8 3 2s-1.4 2-3 2-3 .8-3 2 1.4 2 3 2a3 3 0 003-1.5" fill="none" stroke="#13432c" stroke-width="1.5"/></svg>
          <span id="balVal">0</span>
        </span>
      </div>
      <button class="btn-plus" id="topupBtn" title="Пополнить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="soundBtn" title="Звук">
        <svg viewBox="0 0 24 24" id="sndOn" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 010 8"/></svg>
        <svg viewBox="0 0 24 24" id="sndOff" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6m0-6l-4 6"/></svg>
      </button>
      <button class="icon-btn" id="profileBtn" title="Профиль" onclick="location.hash='#/profile'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="livedrop">
      <div class="ld-head"><i></i> ДРОП</div>
      <div class="ld-view"><div class="ld-track" id="ldTrack"></div></div>
    </aside>
    <main class="main">
      <div id="view"></div>
    </main>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="modals"></div>
<canvas id="fx"></canvas>

<script src="js/kek/skins.js"></script>
<script src="js/kek/cases.js"></script>
<script src="js/kek/extra.js"></script>
<script src="js/app.js"></script>
</body>
</html>
